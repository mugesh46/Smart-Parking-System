services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartparking
      POSTGRES_USER: smartparking
      POSTGRES_PASSWORD: smartparking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    env_file:
      - ../backend/.env.example
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
